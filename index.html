<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 고학년 필수 영단어 마스터</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --secondary: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
      --bg: #F3F4F6;
      --card: #FFFFFF;
      --text: #1F2937;
    }

    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .app-container {
      background: var(--card);
      width: 100%;
      max-width: 680px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 28px;
      margin-top: 10px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 14px 0;
      font-size: 1.6rem;
      color: var(--primary);
    }

    /* 프로필 바 스타일 */
    .profile-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      padding: 8px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .profile-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .profile-chip {
      background: #E2E8F0;
      color: #475569;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .profile-chip.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
    }

    .profile-add-btn {
      background: #FEF3C7;
      color: #D97706;
      border: 1px dashed #F59E0B;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .profile-add-btn:hover { background: #FDE68A; }

    /* 상단 네비게이션 탭 */
    .tab-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #F3F4F6;
      padding: 6px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      color: #6B7280;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .badge-counter-pill {
      background: #FEF3C7;
      color: #D97706;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 800;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #EEF2FF;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      color: var(--primary);
      font-size: 0.95rem;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { background: #9CA3AF; cursor: not-allowed; }
    .btn-secondary { background: var(--secondary); }
    .btn-secondary:hover { background: #059669; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #DC2626; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .btn-outline:hover { background: #EEF2FF; }

    /* 단어 리스트 스타일 */
    .word-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .word-card {
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FAFAFA;
      transition: transform 0.15s;
    }

    .word-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .word-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .word-en {
      font-size: 1.3rem;
      font-weight: 800;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .badge-new { background: #DBEAFE; color: #1E40AF; }
    .badge-review { background: #FEF3C7; color: #92400E; }

    .word-ko { font-size: 1.05rem; color: #4B5563; font-weight: 600; }
    .word-ex { font-size: 0.85rem; color: #6B7280; font-style: italic; margin-top: 2px; }

    .sound-btn {
      background: #E0E7FF;
      color: var(--primary);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sound-btn:hover { background: #C7D2FE; }

    /* 칭찬 스티커판 & 배지 스타일 */
    .reward-summary {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: white;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 24px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
    }

    .summary-item .num {
      font-size: 2rem;
      font-weight: 900;
      margin-top: 4px;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .sticker-card {
      border: 2px solid #E5E7EB;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      background: #F9FAFB;
      position: relative;
      transition: all 0.25s;
    }

    .sticker-card.unlocked {
      background: linear-gradient(180deg, #FFFFFF 0%, #FEFCE8 100%);
      border-color: #FBBF24;
      box-shadow: 0 6px 15px rgba(251, 191, 36, 0.18);
    }

    .sticker-card.locked {
      opacity: 0.65;
      filter: grayscale(85%);
    }

    .sticker-icon {
      font-size: 3.2rem;
      margin-bottom: 8px;
      display: inline-block;
      transition: transform 0.3s;
    }

    .sticker-card.unlocked:hover .sticker-icon {
      transform: scale(1.15) rotate(5deg);
    }

    .sticker-week {
      font-size: 0.8rem;
      font-weight: 800;
      color: #6B7280;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .sticker-card.unlocked .sticker-week {
      color: #D97706;
    }

    .sticker-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 6px;
    }

    .sticker-record {
      font-size: 0.85rem;
      background: #FEF3C7;
      color: #92400E;
      padding: 5px 10px;
      border-radius: 8px;
      font-weight: 700;
      display: inline-block;
      margin-top: 4px;
    }

    .sticker-locked-msg {
      font-size: 0.8rem;
      color: #9CA3AF;
      margin-top: 6px;
    }

    .new-badge-celebration {
      background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
      border: 3px solid #F59E0B;
      border-radius: 18px;
      padding: 20px;
      margin: 20px auto;
      max-width: 420px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 퀴즈 영역 스타일 */
    .quiz-box {
      text-align: center;
      padding: 20px 10px;
    }

    .quiz-progress {
      font-size: 0.9rem;
      color: #6B7280;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .quiz-type-badge {
      display: inline-block;
      background: #F3F4F6;
      color: #374151;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .quiz-prompt {
      font-size: 2rem;
      font-weight: 800;
      margin: 20px 0;
      color: #111827;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }

    .hint-letters {
      font-family: monospace;
      letter-spacing: 4px;
      font-size: 1.5rem;
      color: var(--primary);
      background: #EEF2FF;
      padding: 8px 16px;
      border-radius: 8px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .option-btn {
      background: white;
      border: 2px solid #E5E7EB;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: #F9FAFB;
    }

    .spell-input-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .spell-input {
      padding: 14px 18px;
      font-size: 1.2rem;
      border: 2px solid #D1D5DB;
      border-radius: 10px;
      width: 65%;
      text-align: center;
      outline: none;
    }

    .spell-input:focus { border-color: var(--primary); }

    .feedback-msg {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
    }

    .feedback-correct { background: #D1FAE5; color: #065F46; }
    .feedback-wrong { background: #FEE2E2; color: #991B1B; }

    .nav-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #E5E7EB;
      flex-wrap: wrap;
      gap: 10px;
    }

    .wrong-alert-box {
      background: #FEF2F2;
      border: 2px solid #FCA5A5;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media (max-width: 520px) {
      .options-grid, .sticker-grid { grid-template-columns: 1fr; }
      .spell-input-group { flex-direction: column; align-items: center; }
      .spell-input { width: 100%; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>🎓 초등 고학년 영단어 마스터</h1>

    <!-- 프로필 선택 및 관리 바 -->
    <div class="profile-bar">
      <div style="font-size: 0.85rem; font-weight: 800; color: #64748B;">👤 학습자:</div>
      <div class="profile-list" id="profile-chips-container">
        <!-- JS로 동적 생성 -->
      </div>
      <button class="profile-add-btn" onclick="addNewProfile()">+ 프로필 추가</button>
    </div>

    <!-- 상단 네비게이션 탭 -->
    <div class="tab-menu">
      <button class="tab-btn active" id="tab-study" onclick="switchTab('study')">
        📖 오늘의 학습
      </button>
      <button class="tab-btn" id="tab-rewards" onclick="switchTab('rewards')">
        🏅 칭찬 스티커판 <span class="badge-counter-pill" id="badge-count-pill">0개</span>
      </button>
    </div>

    <div class="status-bar" id="schedule-status-bar">
      <span id="current-schedule">1주차 - Day 1</span>
      <span id="schedule-desc">신규 10단어</span>
    </div>
  </header>

  <!-- 오답 복습 알림 배너 -->
  <div id="wrong-banner" class="wrong-alert-box" style="display: none;">
    <div>
      <strong style="color: #991B1B; font-size: 1.05rem;">🚨 외워야 할 오답 단어가 <span id="wrong-count">0</span>개 있습니다!</strong>
      <div style="font-size: 0.85rem; color: #B91C1C; margin-top: 4px;">다음 날로 넘어가기 전에 다 맞출 때까지 복습해 보세요.</div>
    </div>
    <button class="btn btn-danger" onclick="startWrongNoteQuiz()">오답 시험보기</button>
  </div>

  <!-- 메인 콘텐츠 영역 -->
  <div id="main-view"></div>

  <!-- 하단 진행 컨트롤 -->
  <div class="nav-controls" id="footer-controls">
    <button class="btn btn-outline" onclick="prevSchedule()">◀ 이전 날</button>
    <div style="display:flex; gap: 8px;">
      <button class="btn btn-outline" style="font-size: 0.8rem; padding: 8px 12px;" onclick="resetCurrentProfileData()">현재 프로필 초기화</button>
      <button class="btn" id="next-day-btn" onclick="nextSchedule()">다음 날로 이동 ▶</button>
    </div>
  </div>
</div>

    { id: 260, en: "congratulate", ko: "축하하다", ex: "We gathered to congratulate her on winning the prize." }
  ];

  // =========================================================================
  // 2. 멀티 프로필 시스템 및 앱 상태 관리
  // =========================================================================
  let profiles = ["첫째 아이", "둘째 아이"]; // 기본 프로필 목록
  let currentProfile = "첫째 아이";     // 현재 선택된 프로필 이름
  let currentTab = 'study';              // 'study' 또는 'rewards'

  // 프로필별 진도 데이터 구조 저장소
  let allProfilesData = {};

  function loadGlobalData() {
    const savedProfiles = localStorage.getItem('elem_vocab_profiles');
    if (savedProfiles) {
      profiles = JSON.parse(savedProfiles);
    }
    const savedCurrent = localStorage.getItem('elem_vocab_current_profile');
    if (savedCurrent && profiles.includes(savedCurrent)) {
      currentProfile = savedCurrent;
    } else {
      currentProfile = profiles[0] || "첫째 아이";
    }

    // 각 프로필별 데이터 로드
    profiles.forEach(p => {
      const pData = localStorage.getItem(`elem_vocab_data_${p}`);
      if (pData) {
        allProfilesData[p] = JSON.parse(pData);
      } else {
        allProfilesData[p] = {
          week: 1,
          day: 1,
          wrongWordIds: [],
          dailySchedules: {},
          weeklyRecords: {}
        };
      }
    });
  }

  function saveGlobalData() {
    localStorage.setItem('elem_vocab_profiles', JSON.stringify(profiles));
    localStorage.setItem('elem_vocab_current_profile', currentProfile);
    localStorage.setItem(`elem_vocab_data_${currentProfile}`, JSON.stringify(allProfilesData[currentProfile]));
    updateHeaderAndBanner();
    renderProfileChips();
  }

  function getCurrentState() {
    if (!allProfilesData[currentProfile]) {
      allProfilesData[currentProfile] = {
        week: 1,
        day: 1,
        wrongWordIds: [],
        dailySchedules: {},
        weeklyRecords: {}
      };
    }
    return allProfilesData[currentProfile];
  }

  function switchProfile(profileName) {
    if (!profiles.includes(profileName)) return;
    currentProfile = profileName;
    saveGlobalData();
    renderProfileChips();
    if (currentTab === 'rewards') {
      renderRewardsScreen();
    } else {
      renderMainScreen();
    }
  }

  function addNewProfile() {
    const newName = prompt("새로운 자녀(학생) 이름을 입력하세요:");
    if (!newName) return;
    const trimmed = newName.trim();
    if (!trimmed) return;
    if (profiles.includes(trimmed)) {
      alert("이미 존재하는 프로필 이름입니다.");
      return;
    }
    profiles.push(trimmed);
    allProfilesData[trimmed] = {
      week: 1,
      day: 1,
      wrongWordIds: [],
      dailySchedules: {},
      weeklyRecords: {}
    };
    switchProfile(trimmed);
  }

  function resetCurrentProfileData() {
    if (confirm(`[${currentProfile}]의 학습 기록과 스티커판을 초기화할까요?`)) {
      allProfilesData[currentProfile] = {
        week: 1,
        day: 1,
        wrongWordIds: [],
        dailySchedules: {},
        weeklyRecords: {}
      };
      saveGlobalData();
      if (currentTab === 'rewards') renderRewardsScreen();
      else renderMainScreen();
    }
  }

  function renderProfileChips() {
    const container = document.getElementById('profile-chips-container');
    container.innerHTML = profiles.map(p => {
      const isActive = p === currentProfile;
      return `<button class="profile-chip ${isActive ? 'active' : ''}" onclick="switchProfile('${p}')">${p}</button>`;
    }).join('');
  }

  let quizSession = {
    mode: 'daily',
    questions: [],
    currentIndex: 0,
    score: 0,
    wrongIdsInThisQuiz: []
  };

  function switchTab(tabName) {
    currentTab = tabName;
    document.getElementById('tab-study').classList.toggle('active', tabName === 'study');
    document.getElementById('tab-rewards').classList.toggle('active', tabName === 'rewards');

    if (tabName === 'rewards') {
      renderRewardsScreen();
    } else {

  function getUnlockedBadgeCount() {
    const state = getCurrentState();
    return Object.values(state.weeklyRecords || {}).filter(r => r && r.passed).length;
  }

  // =========================================================================
  // 3. 단어 배정 알고리즘
  // =========================================================================
  function getWordsForDay(week, day) {
    const state = getCurrentState();
    const key = `W${week}_D${day}`;
    if (state.dailySchedules[key]) {
      return state.dailySchedules[key].map(item => ({
        word: WORD_DATABASE.find(w => w.id === item.id),
        isReview: item.isReview
      }));
    }

    let result = [];
    if (week === 1) {
      const startIndex = (day - 1) * 10;
      const slice = WORD_DATABASE.slice(startIndex, startIndex + 10);
      result = slice.map(w => ({ id: w.id, isReview: false }));
    } else {
      const newStartIndex = 50 + (week - 2) * 30 + (day - 1) * 6;
      const newWords = WORD_DATABASE.slice(newStartIndex, newStartIndex + 6);

      let prevWeekPoolIds = [];
      for (let d = 1; d <= 5; d++) {
        const prevDayWords = getWordsForDay(week - 1, d);
        prevDayWords.forEach(pw => {
          if (!prevWeekPoolIds.includes(pw.word.id)) {
            prevWeekPoolIds.push(pw.word.id);
          }
        });
      }

      let alreadyReviewedThisWeek = [];
      for (let d = 1; d < day; d++) {
        const prevKey = `W${week}_D${d}`;
        if (state.dailySchedules[prevKey]) {
          state.dailySchedules[prevKey]
            .filter(item => item.isReview)
            .forEach(item => alreadyReviewedThisWeek.push(item.id));
        }
      }

      let availableReviewIds = prevWeekPoolIds.filter(id => !alreadyReviewedThisWeek.includes(id));
      if (availableReviewIds.length < 4) availableReviewIds = prevWeekPoolIds;

      const shuffledReview = shuffleArray([...availableReviewIds]).slice(0, 4);

      result = [
        ...newWords.map(w => ({ id: w.id, isReview: false })),
        ...shuffledReview.map(id => ({ id: id, isReview: true }))
      ];
    }

    state.dailySchedules[key] = result;
    saveGlobalData();

    return result.map(item => ({
      word: WORD_DATABASE.find(w => w.id === item.id),
      isReview: item.isReview
    }));
  }

  function getWeekPoolWords(week) {
    let list = [];
    for (let d = 1; d <= 5; d++) {
      const dayItems = getWordsForDay(week, d);
      dayItems.forEach(item => list.push(item.word));
    }
    return list;
  }

  // =========================================================================
  // 4. 음성 출력 (Web Speech API)
  // =========================================================================
  function speakWord(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.88;
    window.speechSynthesis.speak(utter);
  }

  // =========================================================================
  // 5. 화면 렌더링 함수
  // =========================================================================
  function updateHeaderAndBanner() {
    const state = getCurrentState();
    const scheduleTitle = document.getElementById('current-schedule');
    const scheduleDesc = document.getElementById('schedule-desc');
    const statusBar = document.getElementById('schedule-status-bar');

    document.getElementById('badge-count-pill').textContent = `${getUnlockedBadgeCount()}개`;

    if (currentTab === 'rewards') {
      statusBar.style.display = 'none';
    } else {
      statusBar.style.display = 'flex';
      if (state.day <= 5) {
        scheduleTitle.textContent = `📅 ${state.week}주차 - Day ${state.day}`;
        scheduleDesc.textContent = state.week === 1 ? '오늘의 단어 10개 (신규 10)' : '오늘의 단어 10개 (신규 6 + 복습 4)';
      } else {
        const rec = state.weeklyRecords[state.week];
        const passText = rec && rec.passed ? `✅ 통과 완료 (최고 ${rec.bestPercent}점)` : '통과 기준: 80점(24개) 이상';
        scheduleTitle.textContent = `🏆 ${state.week}주차 - 주말 최종 시험`;
        scheduleDesc.textContent = passText;
      }
    }

    const banner = document.getElementById('wrong-banner');
    const countSpan = document.getElementById('wrong-count');
    if (state.wrongWordIds.length > 0 && currentTab === 'study') {
      banner.style.display = 'flex';
      countSpan.textContent = state.wrongWordIds.length;
    } else {
      banner.style.display = 'none';
    }
  }

  // =========================================================================
  // 6. 문제 출제 및 퀴즈 엔진
  // =========================================================================
  function createQuestionObject(wordObj) {
    const types = ['listen', 'mc', 'spell'];
    const type = types[Math.floor(Math.random() * types.length)];

    const distractors = shuffleArray(WORD_DATABASE.filter(w => w.id !== wordObj.id))
      .slice(0, 3)
      .map(w => w.ko);
    const options = shuffleArray([wordObj.ko, ...distractors]);

    const chars = wordObj.en.split('');
    const masked = chars.map((ch, idx) => {
      if (idx === 0) return ch;
      if (idx === chars.length - 1 && chars.length > 4) return ch;
      return Math.random() < 0.35 ? ch : '_';
    }).join(' ');

    return {
      word: wordObj,
      type: type,
      options: options,
      maskedHint: masked
    };
  }

  function startDailyPractice() {
    const state = getCurrentState();
    const todayWords = getWordsForDay(state.week, state.day).map(i => i.word);
    quizSession = {
      mode: 'daily',
      questions: shuffleArray(todayWords).map(w => createQuestionObject(w)),
      currentIndex: 0,
      score: 0,
      wrongIdsInThisQuiz: []
    };
    renderQuizQuestion();
  }

  function startWeekendExam() {
    const state = getCurrentState();
    const weekWords = getWeekPoolWords(state.week);
    const selected30 = shuffleArray(weekWords).slice(0, 30);
    quizSession = {
      mode: 'weekend',
      questions: selected30.map(w => createQuestionObject(w)),
      currentIndex: 0,
      score: 0,
      wrongIdsInThisQuiz: []
    };
    renderQuizQuestion();
  }

  function startWrongNoteQuiz() {
    currentTab = 'study';
    document.getElementById('tab-study').classList.add('active');
    document.getElementById('tab-rewards').classList.remove('active');

    const state = getCurrentState();
    const wrongWords = state.wrongWordIds.map(id => WORD_DATABASE.find(w => w.id === id)).filter(Boolean);
    if (wrongWords.length === 0) return;

    quizSession = {
      mode: 'wrong',
      questions: shuffleArray(wrongWords).map(w => createQuestionObject(w)),
      currentIndex: 0,
      score: 0,
      wrongIdsInThisQuiz: []
    };
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    document.getElementById('footer-controls').style.display = 'none';
    const container = document.getElementById('main-view');
    const q = quizSession.questions[quizSession.currentIndex];
    const total = quizSession.questions.length;
    const currentNum = quizSession.currentIndex + 1;

    let modeTitle = quizSession.mode === 'weekend' ? '🏆 주말 최종 시험' :
                    quizSession.mode === 'wrong' ? '🚨 오답 완벽 클리닉' : '✍️ 일일 단어 테스트';

    let typeLabel = '';
    let promptHtml = '';
    let interactionHtml = '';

    if (q.type === 'listen') {
      typeLabel = '🎧 듣고 뜻 맞추기';
      promptHtml = `
        <button class="sound-btn" style="width: 80px; height: 80px; font-size: 2.2rem; margin: 10px auto;" onclick="speakWord('${q.word.en}')">🔊</button>
        <div style="font-size: 1rem; color: #6B7280; font-weight: 500;">버튼을 눌러 발음을 듣고 알맞은 뜻을 고르세요</div>
      `;
      interactionHtml = `
        <div class="options-grid">
          ${q.options.map(opt => `<button class="option-btn" onclick="submitAnswer('${opt}')">${opt}</button>`).join('')}
        </div>
      `;
      setTimeout(() => speakWord(q.word.en), 200);

    } else if (q.type === 'mc') {
      typeLabel = '👀 보고 뜻 맞추기 (객관식)';
      promptHtml = `
        <div>${q.word.en}</div>
        <button class="sound-btn" style="width:38px; height:38px; font-size:1rem;" onclick="speakWord('${q.word.en}')">🔊</button>
      `;
      interactionHtml = `
        <div class="options-grid">
          ${q.options.map(opt => `<button class="option-btn" onclick="submitAnswer('${opt}')">${opt}</button>`).join('')}
        </div>
      `;

    } else if (q.type === 'spell') {
      typeLabel = '⌨️ 철자 빈칸 넣기 (스펠링)';
      promptHtml = `
        <div style="font-size: 1.6rem; color: #1F2937;">뜻: <strong>${q.word.ko}</strong></div>
        <div class="hint-letters">${q.maskedHint}</div>
        <button class="sound-btn" style="width:38px; height:38px; font-size:1rem;" onclick="speakWord('${q.word.en}')" title="발음 힌트 듣기">🔊</button>
      `;
      interactionHtml = `
        <div class="spell-input-group">
          <input type="text" id="spell-input" class="spell-input" placeholder="영어 철자를 입력하세요" autocomplete="off" onkeydown="if(event.key==='Enter') submitSpellAnswer()" />
          <button class="btn" onclick="submitSpellAnswer()">제출</button>
        </div>
      `;
    }

    container.innerHTML = `
      <div class="quiz-box">
        <div class="quiz-progress">${modeTitle} (${currentNum} / ${total})</div>
        <div class="quiz-type-badge">${typeLabel}</div>
        <div class="quiz-prompt">${promptHtml}</div>
        <div id="quiz-interaction">${interactionHtml}</div>
        <div id="quiz-feedback"></div>
        <div style="margin-top: 28px;">
          <button class="btn btn-outline" style="padding: 8px 16px; font-size: 0.85rem;" onclick="renderMainScreen()">시험 중단하고 돌아가기</button>
        </div>
      </div>
    `;

    if (q.type === 'spell') {
      setTimeout(() => {
        const inputEl = document.getElementById('spell-input');
        if (inputEl) inputEl.focus();
      }, 100);
    }
  }

  function submitSpellAnswer() {
    const inputEl = document.getElementById('spell-input');
    if (!inputEl) return;
    const val = inputEl.value.trim();
    if (!val) return;
    submitAnswer(val);
  }

  function submitAnswer(userAnswer) {
    const state = getCurrentState();
    const q = quizSession.questions[quizSession.currentIndex];
    let isCorrect = false;

    if (q.type === 'spell') {
      isCorrect = userAnswer.toLowerCase() === q.word.en.toLowerCase();
    } else {
      isCorrect = userAnswer === q.word.ko;
    }

    document.getElementById('quiz-interaction').style.pointerEvents = 'none';
    const feedbackEl = document.getElementById('quiz-feedback');

    if (isCorrect) {
      quizSession.score++;
      speakWord(q.word.en);
      feedbackEl.innerHTML = `<div class="feedback-msg feedback-correct">⭕ 정답입니다! (${q.word.en} : ${q.word.ko})</div>`;

      if (quizSession.mode === 'wrong') {
        state.wrongWordIds = state.wrongWordIds.filter(id => id !== q.word.id);
        saveGlobalData();
      }
    } else {
      speakWord(q.word.en);
      feedbackEl.innerHTML = `<div class="feedback-msg feedback-wrong">❌ 아쉽네요! 정답은 <strong>${q.word.en} (${q.word.ko})</strong> 입니다.</div>`;
      
      if (!state.wrongWordIds.includes(q.word.id)) {
        state.wrongWordIds.push(q.word.id);
        saveGlobalData();
      }
      if (!quizSession.wrongIdsInThisQuiz.includes(q.word.id)) {
        quizSession.wrongIdsInThisQuiz.push(q.word.id);
      }
    }

    setTimeout(() => {
      quizSession.currentIndex++;
      if (quizSession.currentIndex < quizSession.questions.length) {
        renderQuizQuestion();
      } else {
        renderQuizResult();
      }
    }, 1500);
  }

  function renderQuizResult() {
    const container = document.getElementById('main-view');
    const state = getCurrentState();
    const total = quizSession.questions.length;
    const score = quizSession.score;
    const percent = Math.round((score / total) * 100);
    const passed = percent >= 80;

    let resultHeader = '';
    let resultMessage = '';
    let celebrationHtml = '';
    let actionButtons = '';

    if (quizSession.mode === 'weekend') {
      const prevRec = state.weeklyRecords[state.week];
      const wasAlreadyPassed = prevRec && prevRec.passed;
      const todayStr = new Date().toLocaleDateString('ko-KR');

      state.weeklyRecords[state.week] = {
        passed: wasAlreadyPassed || passed,
        bestScore: prevRec ? Math.max(prevRec.bestScore, score) : score,
        bestPercent: prevRec ? Math.max(prevRec.bestPercent, percent) : percent,
        date: passed ? todayStr : (prevRec ? prevRec.date : '-'),
        attempts: prevRec ? prevRec.attempts + 1 : 1
      };
      saveGlobalData();

      const badgeInfo = BADGE_CATALOG.find(b => b.week === state.week) || { icon: "🏅", title: `${state.week}주차 마스터 배지` };

      if (passed) {
        resultHeader = `🎉 주말 시험 합격! (${percent}점)`;
        resultMessage = `30문제 중 <strong>${score}문제</strong>를 맞혀 80% 통과 기준을 넘었습니다!`;
        celebrationHtml = `
          <div class="new-badge-celebration">
            <div style="font-size: 0.9rem; font-weight: 800; color: #B45309;">
              ${wasAlreadyPassed ? '✨ 칭찬 배지 보유 중 & 최고 기록 경신!' : '🎊 새로운 칭찬 스티커 획득!'}
            </div>
            <div style="font-size: 4rem; margin: 10px 0;">${badgeInfo.icon}</div>
            <div style="font-size: 1.3rem; font-weight: 900; color: #78350F;">${badgeInfo.title}</div>
            <div style="font-size: 0.9rem; color: #92400E; margin-top: 6px;">${currentProfile}의 스티커판에 등록되었어요!</div>
          </div>
        `;
      } else {
        resultHeader = `💦 아깝네요! (${percent}점) - 한 번 더 도전해 볼까요?`;
        resultMessage = `30문제 중 <strong>${score}문제</strong>를 맞혔습니다.<br><strong>24문제(80점) 이상</strong> 맞히면 <strong>${badgeInfo.icon} [${badgeInfo.title}]</strong> 스티커를 받을 수 있어요!`;
      }

      actionButtons = `
        <button class="btn" onclick="startWeekendExam()">🔄 주말 시험 다시 보기</button>
        ${passed ? `<button class="btn btn-warning" onclick="switchTab('rewards')">🏅 ${currentProfile}의 칭찬판 보기</button>` : ''}
        ${state.wrongWordIds.length > 0 ? `<button class="btn btn-danger" onclick="startWrongNoteQuiz()">🚨 틀린 문제(${state.wrongWordIds.length}개) 복습하기</button>` : ''}
        <button class="btn btn-outline" onclick="renderMainScreen()">학습 화면으로</button>
      `;

    } else if (quizSession.mode === 'wrong') {
      if (state.wrongWordIds.length === 0) {
        resultHeader = `🎊 오답 노트 완벽 클리어!`;
        resultMessage = `틀렸던 단어를 전부 다 외워서 맞혔습니다! 이제 다음 날 학습으로 넘어갈 수 있어요.`;
        actionButtons = `<button class="btn btn-secondary" onclick="renderMainScreen()">학습 화면으로 돌아가기</button>`;
      } else {
        resultHeader = `🔥 아직 남은 오답이 ${state.wrongWordIds.length}개 있어요!`;
        resultMessage = `방금 틀린 단어를 다 맞힐 때까지 한 번 더 도전해 보세요!`;
        actionButtons = `
          <button class="btn btn-danger" onclick="startWrongNoteQuiz()">🔁 남은 오답(${state.wrongWordIds.length}개) 마저 다 맞추기</button>
          <button class="btn btn-outline" onclick="renderMainScreen()">단어장 보러 가기</button>
        `;
      }
    } else {
      resultHeader = `👏 일일 테스트 완료! (${score} / ${total})`;
      resultMessage = state.wrongWordIds.length > 0
        ? `틀린 단어 <strong>${state.wrongWordIds.length}개</strong>가 오답 노트에 등록되었습니다. 내일로 넘어가기 전에 꼭 다 외워서 맞춰보세요!`
        : `오늘의 단어 10개를 완벽하게 외웠네요!`;
      actionButtons = `
        <button class="btn" onclick="startDailyPractice()">🔄 다시 시험 보기</button>
        ${state.wrongWordIds.length > 0 ? `<button class="btn btn-danger" onclick="startWrongNoteQuiz()">🚨 틀린 단어 바로 복습하기</button>` : ''}
        <button class="btn btn-outline" onclick="renderMainScreen()">단어장으로 돌아가기</button>
      `;
    }

    container.innerHTML = `
      <div class="quiz-box">
        <h2 style="font-size: 1.8rem; color: var(--primary);">${resultHeader}</h2>
        ${celebrationHtml}
        <p style="font-size: 1.05rem; color: #374151; line-height: 1.6; margin: 20px 0;">${resultMessage}</p>
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px;">
          ${actionButtons}
        </div>
      </div>
    `;
  }

  // =========================================================================
  // 7. 날짜 이동 및 유틸리티
  // =========================================================================
  function nextSchedule() {
    const state = getCurrentState();
    if (state.wrongWordIds.length > 0) {
      const goQuiz = confirm(`아직 다 외우지 못한 오답 단어가 ${state.wrongWordIds.length}개 남아있습니다!\n오답 시험을 봐서 다 맞추시겠어요?\n(취소를 누르면 그대로 다음 날로 넘어갑니다)`);
      if (goQuiz) {
        startWrongNoteQuiz();
        return;
      }
    }

    if (state.day < 6) {
      state.day++;
    } else {
      const maxSupportedWeeks = 1 + Math.floor((WORD_DATABASE.length - 50) / 30);
      if (state.week >= maxSupportedWeeks) {
        alert(`현재 ${maxSupportedWeeks}주차 분량의 단어가 등록되어 있습니다.`);
        return;
      }
      state.week++;
      state.day = 1;
    }
    saveGlobalData();
    renderMainScreen();
  }

  function prevSchedule() {
    const state = getCurrentState();
    if (state.day > 1) {
      state.day--;
    } else if (state.week > 1) {
      state.week--;
      state.day = 6;
    }
    saveGlobalData();
    renderMainScreen();
  }

  function shuffleArray(arr) {
    let copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // 앱 최초 시작
  loadGlobalData();
  renderProfileChips();
  renderMainScreen();
</script>
</body>
