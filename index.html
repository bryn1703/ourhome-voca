<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>우리집 voca</title>
  <style>
    :root {
      --primary: #4F46E5; --primary-hover: #4338CA;
      --secondary: #10B981; --danger: #EF4444;
      --warning: #F59E0B; --bg: #F3F4F6;
      --card: #FFFFFF; --text: #1F2937;
    }

    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg); color: var(--text);
      margin: 0; padding: 16px; display: flex; justify-content: center;
      min-height: 100vh; overflow-x: hidden; word-break: keep-all;
    }

    .app-container {
      background: var(--card); width: 100%; max-width: 720px;
      border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 28px; margin-top: 6px; position: relative; z-index: 10;
    }

    header { text-align: center; margin-bottom: 18px; }
    h1 { margin: 0 0 14px 0; font-size: 1.6rem; color: var(--primary); letter-spacing: -0.5px; }

    /* 프로필 바 */
    .profile-bar {
      display: flex; align-items: center; background: #F8FAFC;
      border: 1px solid #E2E8F0; padding: 8px 12px; border-radius: 14px;
      margin-bottom: 14px; gap: 8px;
    }
    .profile-list {
      display: flex; gap: 6px; align-items: center;
      overflow-x: auto; flex: 1; padding-bottom: 2px; scrollbar-width: none;
    }
    .profile-list::-webkit-scrollbar { display: none; }

    .profile-chip {
      background: #E2E8F0; color: #475569; border: none;
      padding: 7px 12px; border-radius: 20px; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; display: inline-flex;
      align-items: center; gap: 5px; white-space: nowrap; flex-shrink: 0;
    }
    .profile-chip.active {
      background: var(--primary); color: white;
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
    }
    .profile-add-btn {
      background: #FEF3C7; color: #D97706; border: 1px dashed #F59E0B;
      padding: 7px 11px; border-radius: 20px; font-size: 0.85rem; font-weight: 800;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .daily-stars-badge {
      background: #FFFBEB; color: #B45309; font-size: 0.78rem;
      padding: 2px 6px; border-radius: 10px; font-weight: 800; border: 1px solid #FDE68A;
    }

    /* 탭 메뉴 (3탭) */
    .tab-menu {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      background: #F3F4F6; padding: 5px; border-radius: 14px; margin-bottom: 14px;
    }
    .tab-btn {
      background: transparent; border: none; padding: 11px 6px;
      border-radius: 10px; font-size: 0.95rem; font-weight: 700; color: #6B7280;
      cursor: pointer; transition: all 0.2s; display: flex;
      align-items: center; justify-content: center; gap: 4px; white-space: nowrap;
    }
    .tab-btn.active {
      background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .badge-counter-pill {
      background: #FEF3C7; color: #D97706; font-size: 0.75rem;
      padding: 2px 6px; border-radius: 99px; font-weight: 800;
    }

    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #EEF2FF; padding: 12px 16px; border-radius: 12px;
      font-weight: 700; color: var(--primary); font-size: 0.92rem; gap: 8px; flex-wrap: wrap;
    }

    .btn {
      background: var(--primary); color: white; border: none;
      padding: 13px 20px; border-radius: 12px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.15s; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px; touch-action: manipulation;
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary { background: var(--secondary); }
    .btn-danger { background: var(--danger); }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }

    /* 단어 리스트 */
    .word-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 24px; }
    .word-card {
      border: 1px solid #E5E7EB; border-radius: 14px; padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center; background: #FAFAFA; gap: 12px;
    }
    .word-info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
    .word-en { font-size: 1.25rem; font-weight: 800; color: #111827; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; word-break: break-all; }
    .badge { font-size: 0.72rem; padding: 3px 7px; border-radius: 6px; font-weight: 700; white-space: nowrap; }
    .badge-new { background: #DBEAFE; color: #1E40AF; }
    .badge-review { background: #FEF3C7; color: #92400E; }
    .word-ko { font-size: 1.02rem; color: #4B5563; font-weight: 600; }
    .word-ex { font-size: 0.85rem; color: #6B7280; font-style: italic; margin-top: 2px; }
    .sound-btn {
      background: #E0E7FF; color: var(--primary); border: none;
      width: 46px; height: 46px; border-radius: 50%; font-size: 1.2rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sound-btn:active { transform: scale(0.92); background: #C7D2FE; }

    /* ==========================================================
       🏅 칭찬 스티커판 (내 몬스터 상태창 & 별 조각 상태창 분리!)
       ========================================================== */
    .reward-summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }
    .summary-card {
      border-radius: 18px;
      padding: 18px 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.06);
    }
    .summary-card.monster-box {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: white;
    }
    .summary-card.star-box {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      color: white;
    }
    .summary-card .label {
      font-size: 0.88rem;
      font-weight: 700;
      opacity: 0.92;
      margin-bottom: 6px;
    }
    .summary-card .num {
      font-size: 1.55rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .summary-card .sub-info {
      font-size: 0.78rem;
      margin-top: 6px;
      background: rgba(255,255,255,0.2);
      padding: 3px 10px;
      border-radius: 99px;
      font-weight: 700;
    }

    .sticker-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .sticker-card {
      border: 2px solid #E5E7EB; border-radius: 16px; padding: 16px 10px;
      text-align: center; background: #F9FAFB; position: relative; overflow: hidden;
    }
    .sticker-card.unlocked { background: linear-gradient(180deg, #FFFFFF 0%, #FEFCE8 100%); border-color: #FBBF24; }
    .sticker-card.perfect { border: 3px solid #F59E0B; background: linear-gradient(180deg, #FFFBEB 0%, #FEF3C7 100%); }
    .perfect-label { position: absolute; top: 8px; right: -28px; background: #EF4444; color: white; font-size: 0.65rem; font-weight: 900; padding: 3px 30px; transform: rotate(45deg); }
    .sticker-card.locked { opacity: 0.65; filter: grayscale(85%); }
    .sticker-icon { font-size: 2.8rem; margin-bottom: 6px; display: inline-block; }
    .sticker-week { font-size: 0.75rem; font-weight: 800; color: #6B7280; margin-bottom: 4px; }
    .sticker-card.unlocked .sticker-week { color: #D97706; }
    .sticker-title { font-size: 0.98rem; font-weight: 800; color: #111827; margin-bottom: 6px; }
    .sticker-record { font-size: 0.8rem; background: #FEF3C7; color: #92400E; padding: 4px 8px; border-radius: 8px; font-weight: 700; display: inline-block; }

    /* ==========================================================
       🏪 몬스터 상점 & 마이룸 스타일
       ========================================================== */
    .pet-room-card {
      background: linear-gradient(180deg, #EEF2FF 0%, #E0E7FF 100%);
      border: 2px solid #C7D2FE; border-radius: 20px; padding: 22px 16px;
      text-align: center; margin-bottom: 22px; position: relative;
    }
    .pet-speech-bubble {
      background: white; color: #1F2937; padding: 10px 18px;
      border-radius: 20px; font-weight: 800; font-size: 0.95rem;
      display: inline-block; margin-bottom: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06); position: relative;
    }
    .pet-speech-bubble::after {
      content: ''; position: absolute; bottom: -8px; left: 50%;
      transform: translateX(-50%); border-width: 8px 8px 0;
      border-style: solid; border-color: white transparent;
    }
    .pet-avatar-stage {
      font-size: 4.5rem; height: 95px; display: flex;
      align-items: center; justify-content: center; gap: 4px;
      user-select: none; cursor: pointer;
    }
    .pet-bounce { animation: petJump 0.6s ease; }
    @keyframes petJump {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-22px) scale(1.12); }
      60% { transform: translateY(-6px) scale(0.96); }
    }
    .pet-stats-row {
      display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap;
    }
    .pet-stat-pill {
      background: white; padding: 6px 14px; border-radius: 99px;
      font-size: 0.85rem; font-weight: 800; color: #4338CA;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
    }

    .shop-section-title {
      font-size: 1.05rem; font-weight: 800; color: #1F2937;
      margin: 18px 0 10px 0; display: flex; align-items: center; gap: 6px;
    }
    .shop-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    }
    .shop-item-card {
      border: 2px solid #E5E7EB; border-radius: 16px; padding: 14px;
      background: #FFFFFF; display: flex; flex-direction: column;
      align-items: center; text-align: center; justify-content: space-between;
      transition: all 0.15s;
    }
    .shop-item-card.equipped {
      border-color: var(--primary); background: #F5F3FF;
    }
    .shop-item-icon { font-size: 2.4rem; margin-bottom: 6px; }
    .shop-item-name { font-weight: 800; font-size: 0.95rem; color: #111827; }
    .shop-item-desc { font-size: 0.78rem; color: #6B7280; margin: 4px 0 10px 0; }

    /* 축하 박스 */
    .new-badge-celebration, .daily-reward-celebration { border-radius: 18px; padding: 20px; margin: 16px auto; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .new-badge-celebration { background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%); border: 3px solid #F59E0B; }
    .daily-reward-celebration { background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%); border: 3px solid #10B981; }
    @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* 퀴즈 영역 */
    .quiz-box { text-align: center; padding: 14px 4px; position: relative; }
    .combo-overlay { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%) scale(0.5); opacity: 0; pointer-events: none; z-index: 50; width: 100%; text-align: center; }
    .combo-text { font-size: clamp(2.4rem, 9vw, 4.2rem); font-weight: 900; font-style: italic; color: #FBBF24; -webkit-text-stroke: 1.5px #D97706; text-shadow: 2px 2px 0px #000; white-space: nowrap; }
    @keyframes comboPop {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.1) rotate(-4deg); opacity: 1; }
      30% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1) translateY(-10px); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
    }

    .quiz-prompt {
      font-size: clamp(1.5rem, 6vw, 2.1rem); font-weight: 800; margin: 16px 0;
      color: #111827; min-height: 60px; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 12px; word-break: break-word;
    }
    .hint-letters {
      font-family: monospace; letter-spacing: 2px; font-size: clamp(1.05rem, 4.5vw, 1.5rem);
      color: var(--primary); background: #EEF2FF; padding: 10px 12px;
      border-radius: 10px; max-width: 100%; overflow-x: auto; white-space: nowrap;
    }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .option-btn {
      background: white; border: 2px solid #E5E7EB; padding: 16px 12px;
      border-radius: 14px; font-size: 1.05rem; font-weight: 700; color: #1F2937;
      cursor: pointer; transition: all 0.1s; min-height: 58px; display: flex; align-items: center; justify-content: center;
    }
    .option-btn:active { border-color: var(--primary); background: #EEF2FF; transform: scale(0.98); }

    .spell-input-group { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
    .spell-input {
      padding: 14px; font-size: 1.15rem; border: 2px solid #D1D5DB;
      border-radius: 12px; width: 65%; text-align: center; outline: none; -webkit-appearance: none;
    }
    .spell-input:focus { border-color: var(--primary); }

    .feedback-msg { margin-top: 18px; padding: 13px; border-radius: 12px; font-weight: 700; font-size: 0.98rem; }
    .feedback-correct { background: #D1FAE5; color: #065F46; }
    .feedback-wrong { background: #FEE2E2; color: #991B1B; animation: shake 0.4s; }
    @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

    .nav-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 16px; border-top: 1px solid #E5E7EB; flex-wrap: wrap; gap: 10px; }
    .wrong-alert-box { background: #FEF2F2; border: 2px solid #FCA5A5; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }

    #confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; overflow: hidden; display: none; }
    .confetti-piece { position: absolute; width: 10px; height: 20px; background: #ffd300; top: -20px; opacity: 0; }

    /* 모바일 최적화 */
    @media (max-width: 600px) {
      body { padding: 8px; }
      .app-container { padding: 18px 14px; border-radius: 18px; margin-top: 0; }
      h1 { font-size: 1.3rem; margin-bottom: 10px; }
      .tab-btn { font-size: 0.82rem; padding: 10px 4px; }
      .status-bar { font-size: 0.85rem; padding: 10px 12px; }
      .wrong-alert-box { flex-direction: column; text-align: center; }
      .wrong-alert-box .btn { width: 100%; }

      /* 모바일에서 몬스터 상태창과 별조각 상태창을 위아래(또는 깔끔한 2박스)로 완전히 분리 */
      .reward-summary-grid { grid-template-columns: 1fr; gap: 10px; }
      .summary-card { padding: 16px 12px; }
      .summary-card .num { font-size: 1.45rem; }

      #main-view > div:first-child { flex-direction: column; align-items: stretch !important; gap: 10px; text-align: center; }
      #main-view > div:first-child .btn { width: 100%; }

      .options-grid { grid-template-columns: 1fr; gap: 10px; }
      .option-btn { padding: 14px; font-size: 1rem; min-height: 52px; }

      .spell-input-group { flex-direction: column; align-items: stretch; }
      .spell-input { width: 100%; font-size: 1.1rem; }
      .spell-input-group .btn { width: 100%; padding: 14px; }

      .sticker-grid, .shop-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .sticker-card, .shop-item-card { padding: 12px 8px; }
      .sticker-icon { font-size: 2.2rem; }
      .sticker-title { font-size: 0.88rem; }

      .nav-controls { flex-direction: column-reverse; align-items: stretch; }
      .nav-controls > div { display: flex; width: 100%; justify-content: space-between; }
      .nav-controls > button { width: 100%; }
      #next-day-btn { flex: 1; }
    }
  </style>
</head>
<body>

<div id="confetti-container"></div>

<div class="app-container">
  <header>
    <h1>🎓 우리집 voca</h1>

    <!-- 프로필 선택 바 -->
    <div class="profile-bar">
      <div style="font-size: 0.85rem; font-weight: 800; color: #64748B;">👤 플레이어:</div>
      <div class="profile-list" id="profile-chips-container"></div>
      <button class="profile-add-btn" onclick="addNewProfile()">+ 추가</button>
    </div>

    <!-- 상단 탭 (3개) -->
    <div class="tab-menu">
      <button class="tab-btn active" id="tab-study" onclick="switchTab('study')">
        📖 일일 퀘스트
      </button>
      <button class="tab-btn" id="tab-rewards" onclick="switchTab('rewards')">
        🏅 스티커 도감 <span class="badge-counter-pill" id="badge-count-pill">0</span>
      </button>
      <button class="tab-btn" id="tab-shop" onclick="switchTab('shop')">
        🏪 몬스터 상점 <span class="badge-counter-pill" id="star-count-pill">⭐0</span>
      </button>
    </div>

    <div class="status-bar" id="schedule-status-bar">
      <span id="current-schedule">1주차 - Day 1</span>
      <span id="schedule-desc">신규 10단어</span>
    </div>
  </header>

  <!-- 오답 복습 알림 배너 -->
  <div id="wrong-banner" class="wrong-alert-box" style="display: none;">
    <div>
      <strong style="color: #991B1B; font-size: 1.05rem;">🚨 물리쳐야 할 오답 몬스터가 <span id="wrong-count">0</span>마리!</strong>
      <div style="font-size: 0.85rem; color: #B91C1C; margin-top: 4px;">다음 날로 넘어가기 전에 완벽히 복습해 보세요.</div>
    </div>
    <button class="btn btn-danger" onclick="startWrongNoteQuiz()">오답 시험보기</button>
  </div>

  <!-- 메인 콘텐츠 영역 -->
  <div id="main-view"></div>

  <!-- 하단 컨트롤 -->
  <div class="nav-controls" id="footer-controls">
    <button class="btn btn-outline" onclick="prevSchedule()">◀ 이전 날</button>
    <div style="display:flex; gap: 8px;">
      <button class="btn btn-outline" style="font-size: 0.8rem; padding: 8px 12px;" onclick="resetCurrentProfileData()">초기화</button>
      <button class="btn" id="next-day-btn" onclick="nextSchedule()">다음 날로 이동 ▶</button>
    </div>
  </div>
</div>

<script>
  // =========================================================================
  // 0. 사운드 & 폭죽 효과
  // =========================================================================
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSFX(type) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(850, now + 0.12);
      gainNode.gain.setValueAtTime(0.1, now);
      gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
      osc.start(now); osc.stop(now + 0.22);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
      gainNode.gain.setValueAtTime(0.1, now);
      gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'eat') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.setValueAtTime(650, now + 0.08);
      osc.frequency.setValueAtTime(900, now + 0.16);
      gainNode.gain.setValueAtTime(0.12, now);
      gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'fanfare') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(554, now + 0.15);
      osc.frequency.setValueAtTime(659, now + 0.3);
      gainNode.gain.setValueAtTime(0.1, now);
      gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.start(now); osc.stop(now + 0.6);
    }
  }

  function fireConfetti() {
    const container = document.getElementById('confetti-container');
    container.style.display = 'block';
    container.innerHTML = '';
    const colors = ['#fce18a', '#ff726d', '#b48def', '#f4306d', '#34d399', '#60a5fa'];
    for (let i = 0; i < 80; i++) {
      let piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

  function getDefaultProfileObj() {
    return {
      week: 1, day: 1, wrongWordIds: [], dailySchedules: {}, weeklyRecords: {},
      stars: 0, perfectWeeks: [], petExp: 0, ownedItems: [], equippedItem: null
    };
  }

  function loadGlobalData() {
    const savedProfiles = localStorage.getItem('elem_vocab_profiles');
    if (savedProfiles) {
      try {
        const parsed = JSON.parse(savedProfiles);
        if (Array.isArray(parsed) && parsed.length > 0) profiles = parsed;
      } catch (e) { profiles = ["첫째 아이"]; }
    }

    const savedCurrent = localStorage.getItem('elem_vocab_current_profile');
    if (savedCurrent && profiles.includes(savedCurrent)) currentProfile = savedCurrent;
    else currentProfile = profiles[0];

    profiles.forEach(p => {
      const pData = localStorage.getItem(`elem_vocab_data_${p}`);
      if (pData) {
        allProfilesData[p] = { ...getDefaultProfileObj(), ...JSON.parse(pData) };
      } else {
        allProfilesData[p] = getDefaultProfileObj();
      }
    });

    localStorage.setItem('elem_vocab_profiles', JSON.stringify(profiles));
    localStorage.setItem('elem_vocab_current_profile', currentProfile);
  }

  function saveGlobalData() {
    localStorage.setItem('elem_vocab_profiles', JSON.stringify(profiles));
    localStorage.setItem('elem_vocab_current_profile', currentProfile);
    localStorage.setItem(`elem_vocab_data_${currentProfile}`, JSON.stringify(allProfilesData[currentProfile]));
    updateHeaderAndBanner();
    renderProfileChips();
  }

  function getCurrentState() { return allProfilesData[currentProfile]; }

  function getMonsterIcon(badgeCount) {
    if (badgeCount < 1) return { icon: "🥚", name: "신비한 알" };
    if (badgeCount < 3) return { icon: "🐣", name: "아기 공룡" };
    if (badgeCount < 5) return { icon: "🦎", name: "꼬마 드래곤" };
    if (badgeCount < 7) return { icon: "🦖", name: "전투 티렉스" };
    return { icon: "🐉", name: "전설의 드래곤" };
  }

  function getEquippedAccessoryIcon(profileName = currentProfile) {
    const st = allProfilesData[profileName];
    if (!st || !st.equippedItem) return '';
    const found = SHOP_ACCESSORIES.find(a => a.id === st.equippedItem);
    return found ? found.icon : '';
  }

  function getUnlockedBadgeCount(profileName = currentProfile) {
    const state = allProfilesData[profileName];
    if (!state) return 0;
    return Object.values(state.weeklyRecords || {}).filter(r => r && r.passed).length;
  }

  function switchProfile(profileName) {
    if (!profiles.includes(profileName)) return;
    currentProfile = profileName;
    petBubbleMessage = `${currentProfile}, 반가워! 오늘도 같이 단어를 외워볼까? 🌟`;
    saveGlobalData();
    if (currentTab === 'rewards') renderRewardsScreen();
    else if (currentTab === 'shop') renderShopScreen();
    else renderMainScreen();
  }

  function addNewProfile() {
    const newName = prompt("새로운 자녀(학생) 이름을 입력하세요:");
    if (!newName || !newName.trim()) return;
    const trimmed = newName.trim();
    if (profiles.includes(trimmed)) { alert("이미 존재하는 프로필입니다."); return; }
    profiles.push(trimmed);
    allProfilesData[trimmed] = getDefaultProfileObj();
    switchProfile(trimmed);
  }

  function deleteProfile(event, profileName) {
    event.stopPropagation();
    if (profiles.length <= 1) { alert("최소 1명의 플레이어는 남아있어야 합니다."); return; }
    if (confirm(`[${profileName}] 플레이어를 삭제할까요?`)) {
      profiles = profiles.filter(p => p !== profileName);
      localStorage.removeItem(`elem_vocab_data_${profileName}`);
      delete allProfilesData[profileName];
      if (currentProfile === profileName) currentProfile = profiles[0];
      saveGlobalData();
      if (currentTab === 'rewards') renderRewardsScreen();
      else if (currentTab === 'shop') renderShopScreen();
      else renderMainScreen();
    }
  }

  function resetCurrentProfileData() {
    if (confirm(`[${currentProfile}]의 학습 기록, 스티커, 별 조각을 초기화할까요?`)) {
      allProfilesData[currentProfile] = getDefaultProfileObj();

      else if (currentTab === 'shop') renderShopScreen();

  }

  // 3. 단어 배정 & 화면 렌더링 (일일 학습 / 스티커 도감 / 몬스터 상점)

  function getWordsForDay(week, day) {
    const state = getCurrentState();
    const key = `W${week}_D${day}`;
    if (state.dailySchedules[key]) {
      return state.dailySchedules[key].map(item => ({
        word: WORD_DATABASE.find(w => w.id === item.id),
        isReview: item.isReview
      }));
    }

    let result = [];
    if (week === 1) {
      const startIndex = (day - 1) * 10;
      result = WORD_DATABASE.slice(startIndex, startIndex + 10).map(w => ({ id: w.id, isReview: false }));
    } else {
      const newStartIndex = 50 + (week - 2) * 30 + (day - 1) * 6;
      const newWords = WORD_DATABASE.slice(newStartIndex, newStartIndex + 6);
      let prevWeekPoolIds = [];
      for (let d = 1; d <= 5; d++) {
        getWordsForDay(week - 1, d).forEach(pw => {
          if (!prevWeekPoolIds.includes(pw.word.id)) prevWeekPoolIds.push(pw.word.id);
        });
      }
      const shuffledReview = [...prevWeekPoolIds].sort(() => Math.random() - 0.5).slice(0, 4);
      result = [
        ...newWords.map(w => ({ id: w.id, isReview: false })),
        ...shuffledReview.map(id => ({ id: id, isReview: true }))
      ];
    }
    state.dailySchedules[key] = result;
    saveGlobalData();
    return result.map(item => ({ word: WORD_DATABASE.find(w => w.id === item.id), isReview: item.isReview }));
  }

  function speakWord(text) {
    initAudio();
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US'; utter.rate = 0.88;
    window.speechSynthesis.speak(utter);
  }

    const accHtml = SHOP_ACCESSORIES.map(acc => {
      const isOwned = (state.ownedItems || []).includes(acc.id);
      const isEquipped = state.equippedItem === acc.id;
      let btnHtml = '';
      if (isEquipped) {
        btnHtml = `<button class="btn btn-outline" style="width:100%; padding: 9px; font-size:0.9rem;" onclick="toggleAccessory('${acc.id}')">해제하기</button>`;
      } else if (isOwned) {
        btnHtml = `<button class="btn btn-secondary" style="width:100%; padding: 9px; font-size:0.9rem;" onclick="toggleAccessory('${acc.id}')">착용하기</button>`;
      } else {
        btnHtml = `<button class="btn" style="width:100%; padding: 9px; font-size:0.9rem;" onclick="buyAccessory('${acc.id}')">⭐ ${acc.cost}개 구매</button>`;
      }

      return `
        <div class="shop-item-card ${isEquipped ? 'equipped' : ''}">
          <div>
            <div class="shop-item-icon">${acc.icon}</div>
            <div class="shop-item-name">${acc.name}</div>
            <div class="shop-item-desc">${acc.desc}</div>
          </div>
          ${btnHtml}
        </div>
      `;
    }).join('');

    document.getElementById('main-view').innerHTML = `
      <div class="pet-room-card">
        <div class="pet-speech-bubble" id="pet-bubble">${petBubbleMessage}</div>
        <div class="pet-avatar-stage" id="pet-stage" onclick="pokeMonster()">
          <span>${accIcon}</span><span>${monster.icon}</span>
        </div>
        <div style="font-weight: 800; color: #312E81; font-size: 1.1rem;">${currentProfile}의 ${monster.name}</div>
        <div class="pet-stats-row">
          <span class="pet-stat-pill">💕 애정도 Lv.${petLv} (다음 레벨까지 +${expRemain})</span>
          <span class="pet-stat-pill" style="color:#B45309; background:#FFFBEB;">⭐ 보유 별조각: ${state.stars || 0}개</span>
        </div>
      </div>

      <div class="shop-section-title">🍓 냠냠 몬스터 간식 코너</div>
      <div class="shop-grid">${foodsHtml}</div>

      <div class="shop-section-title">👑 멋쟁이 꾸미기 아이템</div>
      <div class="shop-grid">${accHtml}</div>
    `;
  }

  function pokeMonster() {
    playSFX('correct');
    const stage = document.getElementById('pet-stage');
    if (stage) {
      stage.classList.remove('pet-bounce');
      void stage.offsetWidth;
      stage.classList.add('pet-bounce');
    }
  }

  function buyFood(foodId) {
    const state = getCurrentState();
    const food = SHOP_FOODS.find(f => f.id === foodId);
    if (!food) return;

    if ((state.stars || 0) < food.cost) {
      playSFX('wrong');
      alert(`별 조각이 부족해요! (현재 ⭐${state.stars || 0}개)\n일일 퀘스트를 완료해서 별 조각을 모아보세요!`);
      return;
    }

    state.stars -= food.cost;
    state.petExp = (state.petExp || 0) + food.exp;
    petBubbleMessage = food.msg;
    playSFX('eat');
    saveGlobalData();
    renderShopScreen();
    setTimeout(pokeMonster, 50);
  }

  function buyAccessory(accId) {
    const state = getCurrentState();
    const acc = SHOP_ACCESSORIES.find(a => a.id === accId);
    if (!acc) return;

    if ((state.stars || 0) < acc.cost) {
      playSFX('wrong');
      alert(`별 조각이 부족해요! (현재 ⭐${state.stars || 0}개)`);
      return;
    }

    state.stars -= acc.cost;
    if (!state.ownedItems) state.ownedItems = [];
    state.ownedItems.push(acc.id);
    state.equippedItem = acc.id;
    petBubbleMessage = `우와! [${acc.name}] 정말 마음에 들어! 멋지지? ✨`;
    playSFX('fanfare');
    saveGlobalData();
    renderShopScreen();
    setTimeout(pokeMonster, 50);
  }

  function toggleAccessory(accId) {
    const state = getCurrentState();
    if (state.equippedItem === accId) {
      state.equippedItem = null;
      petBubbleMessage = `아이템을 벗었어! 시원하네~ 😊`;
    } else {
      state.equippedItem = accId;
      const acc = SHOP_ACCESSORIES.find(a => a.id === accId);
      petBubbleMessage = `[${acc.name}] 장착 완료! 어때, 잘 어울려? 😎`;
    }
    playSFX('correct');
    saveGlobalData();
    renderShopScreen();
  }

  function renderMainScreen() {
    updateHeaderAndBanner();
    document.getElementById('footer-controls').style.display = 'flex';
    const state = getCurrentState();

    if (state.day === 6) {
      document.getElementById('main-view').innerHTML = `
        <div style="text-align: center; padding: 24px 10px;">
          <div style="font-size: 3.5rem; margin-bottom: 10px;">📝</div>
          <h2 style="margin-bottom: 10px;">${state.week}주차 주말 보스전!</h2>
          <p style="color: #4B5563; line-height: 1.6; margin-bottom: 24px;">이번 주 배운 단어 30문제가 무작위 출제됩니다.<br><span style="color: var(--primary); font-weight: 700;">80% 이상 통과 시 칭찬 배지 획득!</span><br>100점을 맞으면 전설의 배지로 변합니다!</p>
          <button class="btn" style="font-size: 1.15rem; padding: 16px 32px;" onclick="startWeekendExam()">🚀 주말 보스전 시작</button>
        </div>
      `;
      return;
    }

    const todayWords = getWordsForDay(state.week, state.day);
    let cardsHtml = todayWords.map((item, idx) => `
      <div class="word-card">
        <div class="word-info">
          <div class="word-en"><span>${idx + 1}. ${item.word.en}</span><span class="badge ${item.isReview ? 'badge-review' : 'badge-new'}">${item.isReview ? '🔄 복습' : '✨ 신규'}</span></div>
          <div class="word-ko">${item.word.ko}</div>
          <div class="word-ex">"${item.word.ex}"</div>
        </div>
        <button class="sound-btn" onclick="speakWord('${item.word.en}')">🔊</button>
      </div>
    `).join('');

    document.getElementById('main-view').innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <span style="font-weight: 700; color: #374151;">🔊 단어를 외우고 일일 퀘스트(⭐+10)에 도전하세요!</span>
        <button class="btn btn-secondary" onclick="startDailyPractice()">✍️ 일일 퀘스트 시작</button>
      </div>
      <div class="word-grid">${cardsHtml}</div>
    `;
  }

  // =========================================================================
  // 4. 퀴즈 엔진 & 콤보 시스템
  // =========================================================================
  function startDailyPractice() {
    initAudio();
    const todayWords = getWordsForDay(getCurrentState().week, getCurrentState().day).map(i => i.word);
    quizSession = { mode: 'daily', questions: todayWords.map(w => createQuestionObject(w)), currentIndex: 0, score: 0, comboCount: 0, wrongIdsInThisQuiz: [] };
    renderQuizQuestion();
  }

  function startWeekendExam() {
    initAudio();
    let weekWords = [];
    for (let d = 1; d <= 5; d++) getWordsForDay(getCurrentState().week, d).forEach(item => weekWords.push(item.word));
    const selected30 = weekWords.sort(() => Math.random() - 0.5).slice(0, 30);
    quizSession = { mode: 'weekend', questions: selected30.map(w => createQuestionObject(w)), currentIndex: 0, score: 0, comboCount: 0, wrongIdsInThisQuiz: [] };
    renderQuizQuestion();
  }

  function startWrongNoteQuiz() {
    initAudio();
    currentTab = 'study';
    document.getElementById('tab-study').classList.add('active');
    document.getElementById('tab-rewards').classList.remove('active');
    document.getElementById('tab-shop').classList.remove('active');

    const state = getCurrentState();
    const wrongWords = state.wrongWordIds.map(id => WORD_DATABASE.find(w => w.id === id)).filter(Boolean);
    if (wrongWords.length === 0) return;
    quizSession = { mode: 'wrong', questions: wrongWords.map(w => createQuestionObject(w)), currentIndex: 0, score: 0, comboCount: 0, wrongIdsInThisQuiz: [] };
    renderQuizQuestion();
  }

  function createQuestionObject(w) {
    const type = ['listen', 'mc', 'spell'][Math.floor(Math.random() * 3)];
    const options = [w.ko, ...WORD_DATABASE.filter(x => x.id !== w.id).sort(() => Math.random() - 0.5).slice(0, 3).map(x => x.ko)].sort(() => Math.random() - 0.5);
    const masked = w.en.split('').map((ch, i) => (i === 0 || Math.random() < 0.3) ? ch : '_').join(' ');
    return { word: w, type, options, maskedHint: masked };
  }

  function renderQuizQuestion() {
    document.getElementById('footer-controls').style.display = 'none';
    const q = quizSession.questions[quizSession.currentIndex];
    
    let promptHtml = ''; let interactionHtml = '';
    if (q.type === 'listen') {
      promptHtml = `<button class="sound-btn" style="width: 80px; height: 80px; font-size: 2.2rem; margin: 10px auto;" onclick="speakWord('${q.word.en}')">🔊</button>`;
      interactionHtml = `<div class="options-grid">${q.options.map(o => `<button class="option-btn" onclick="submitAnswer('${o}')">${o}</button>`).join('')}</div>`;
      setTimeout(() => speakWord(q.word.en), 200);
    } else if (q.type === 'mc') {
      promptHtml = `<div>${q.word.en}</div><button class="sound-btn" style="width:42px; height:42px; font-size:1.1rem;" onclick="speakWord('${q.word.en}')">🔊</button>`;
      interactionHtml = `<div class="options-grid">${q.options.map(o => `<button class="option-btn" onclick="submitAnswer('${o}')">${o}</button>`).join('')}</div>`;
    } else if (q.type === 'spell') {
      promptHtml = `<div style="font-size: 1.5rem; color: #1F2937;">뜻: <strong>${q.word.ko}</strong></div><div class="hint-letters">${q.maskedHint}</div><button class="sound-btn" style="width:40px; height:40px; font-size:1rem;" onclick="speakWord('${q.word.en}')">🔊</button>`;
      interactionHtml = `<div class="spell-input-group"><input type="text" id="spell-input" class="spell-input" placeholder="영어 철자 입력" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitSpellAnswer()" /><button class="btn" onclick="submitSpellAnswer()">제출</button></div>`;
    }

    document.getElementById('main-view').innerHTML = `
      <div class="quiz-box">
        <div id="combo-display" class="combo-overlay"></div>
        <div style="font-weight:700; color:#6B7280; margin-bottom:8px;">문제 ${quizSession.currentIndex + 1} / ${quizSession.questions.length}</div>
        <div class="quiz-prompt">${promptHtml}</div>
        <div id="quiz-interaction">${interactionHtml}</div>
        <div id="quiz-feedback"></div>
        <div style="margin-top: 24px;">
          <button class="btn btn-outline" style="padding: 8px 16px; font-size: 0.85rem;" onclick="renderMainScreen()">나가기</button>
        </div>
      </div>
    `;
    if (q.type === 'spell') setTimeout(() => document.getElementById('spell-input')?.focus(), 100);
  }

  function submitSpellAnswer() { const val = document.getElementById('spell-input')?.value.trim(); if (val) submitAnswer(val); }

  function submitAnswer(userAnswer) {
    const state = getCurrentState();
    const q = quizSession.questions[quizSession.currentIndex];
    const isCorrect = q.type === 'spell' ? userAnswer.toLowerCase() === q.word.en.toLowerCase() : userAnswer === q.word.ko;

    document.getElementById('quiz-interaction').style.pointerEvents = 'none';
    const feedbackEl = document.getElementById('quiz-feedback');
    const comboEl = document.getElementById('combo-display');

    if (isCorrect) {
      playSFX('correct');
      quizSession.score++;
      quizSession.comboCount++;
      feedbackEl.innerHTML = `<div class="feedback-msg feedback-correct">⭕ 정답입니다! (${q.word.en})</div>`;
      
      if (quizSession.comboCount >= 2) {
        comboEl.innerHTML = `<div class="combo-text">🔥 ${quizSession.comboCount} COMBO!</div>`;
        comboEl.style.animation = 'none';
        void comboEl.offsetWidth;
        comboEl.style.animation = 'comboPop 1.5s forwards';
      }

      if (quizSession.mode === 'wrong') { state.wrongWordIds = state.wrongWordIds.filter(id => id !== q.word.id); saveGlobalData(); }
    } else {
      playSFX('wrong');
      quizSession.comboCount = 0;
      comboEl.style.animation = 'none';
      feedbackEl.innerHTML = `<div class="feedback-msg feedback-wrong">❌ 오답! 정답: <strong>${q.word.en} (${q.word.ko})</strong></div>`;
      if (!state.wrongWordIds.includes(q.word.id)) { state.wrongWordIds.push(q.word.id); saveGlobalData(); }
    }

    setTimeout(() => {
      quizSession.currentIndex++;
      if (quizSession.currentIndex < quizSession.questions.length) renderQuizQuestion();
      else renderQuizResult();
    }, 1250);
  }

  function renderQuizResult() {
    const state = getCurrentState();
    const total = quizSession.questions.length;
    const score = quizSession.score;
    const percent = Math.round((score / total) * 100);

    let html = `<div class="quiz-box"><h2 style="font-size: 1.8rem; color: var(--primary);">결과: ${score} / ${total}개 정답 (${percent}점)</h2>`;

    if (quizSession.mode === 'weekend') {
      const passed = percent >= 80;
      const isPerfect = percent === 100;
      const prevRec = state.weeklyRecords[state.week];
      state.weeklyRecords[state.week] = {
        passed: (prevRec && prevRec.passed) || passed,
        bestScore: prevRec ? Math.max(prevRec.bestScore, score) : score,
        bestPercent: prevRec ? Math.max(prevRec.bestPercent, percent) : percent,
        date: new Date().toLocaleDateString('ko-KR')
      };
      
      if (isPerfect && !state.perfectWeeks.includes(state.week)) {
        state.perfectWeeks.push(state.week);
      }

      if (passed) {
        state.stars = (state.stars || 0) + 20; // 주말 통과 보너스 별조각
        saveGlobalData();
        playSFX('fanfare');
        fireConfetti();
        html += `
          <div class="new-badge-celebration">
            <div style="font-size: 4rem;">${isPerfect ? '👑' : '🏅'}</div>
            <div style="font-size: 1.3rem; font-weight: 900;">${isPerfect ? '전설의 퍼펙트 클리어!' : '주말 보스전 통과!'}</div>
            <div style="font-size: 0.95rem; margin-top:6px; color:#92400E;">칭찬 배지 & 보너스 별조각 ⭐20개 획득!</div>
          </div>
          <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
            <button class="btn" onclick="switchTab('rewards')">🏅 스티커 도감 보기</button>
            <button class="btn btn-warning" onclick="switchTab('shop')">🏪 상점 가기</button>
          </div>
        `;
      } else {
        saveGlobalData();
        html += `<p>80점(24개) 이상이어야 통과합니다. 다시 도전해 보세요!</p><button class="btn" onclick="startWeekendExam()">🔄 재도전</button>`;
      }
    } else {
      let earnedStars = quizSession.mode === 'wrong' ? 5 : 10;
      state.stars = (state.stars || 0) + earnedStars;
      saveGlobalData();
      playSFX('fanfare');

      html += `
        <div class="daily-reward-celebration">
          <div style="font-size: 3rem;">⭐</div>
          <div style="font-size: 1.2rem; font-weight: 800;">퀘스트 완료! 별조각 ${earnedStars}개 획득!</div>
        </div>
        <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
          <button class="btn" onclick="renderMainScreen()">📖 단어장으로</button>
          <button class="btn btn-warning" onclick="switchTab('shop')">🏪 몬스터 간식 주러 가기</button>
        </div>
      `;
    }

    html += `</div>`;
    document.getElementById('main-view').innerHTML = html;
  }

  // =========================================================================
  // 5. 날짜 이동
  // =========================================================================
  function nextSchedule() {
    const state = getCurrentState();
    if (state.wrongWordIds.length > 0) {
      if (confirm(`물리쳐야 할 오답 몬스터가 ${state.wrongWordIds.length}마리 남아있습니다!\n오답 시험을 먼저 보시겠습니까?`)) {
        startWrongNoteQuiz();
        return;
      }
    }
    if (state.day < 6) {
      state.day++;
    } else {
      const maxSupportedWeeks = 1 + Math.floor((WORD_DATABASE.length - 50) / 30);
      if (state.week >= maxSupportedWeeks) {
        alert(`축하합니다! ${maxSupportedWeeks}주차 모든 커리큘럼을 완주했습니다!`);
        return;
      }
      state.week++;
      state.day = 1;
    }
    saveGlobalData();
    renderMainScreen();
  }

  function prevSchedule() {
    const state = getCurrentState();
    if (state.day > 1) state.day--;
    else if (state.week > 1) { state.week--; state.day = 6; }
    saveGlobalData();
    renderMainScreen();
  }

  // 앱 시작
  loadGlobalData();
  renderProfileChips();
  renderMainScreen();
</script>
</body>
</html>
